services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tob
      POSTGRES_PASSWORD: tob
      POSTGRES_DB: tob_dev
    ports:
      - "5432:5432"
    volumes:
      - tob-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tob -d tob_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  tob-pgdata:
